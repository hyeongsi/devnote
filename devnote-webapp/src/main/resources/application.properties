spring.application.name=devnote-webapp
spring.profiles.default=local
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.encoding=UTF-8
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

devnote.ai.gemini.api-key=${GEMINI_API_KEY:}
devnote.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
devnote.ai.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:8192}
devnote.ai.gemini.max-split-depth=${GEMINI_MAX_SPLIT_DEPTH:2}
devnote.ai.gemini.max-generation-calls=${GEMINI_MAX_GENERATION_CALLS:20}
devnote.ai.gemini.max-plan-sections=${GEMINI_MAX_PLAN_SECTIONS:2}
devnote.ai.gemini.max-units-per-section=${GEMINI_MAX_UNITS_PER_SECTION:1}
devnote.ai.gemini.second-review-enabled=${GEMINI_SECOND_REVIEW_ENABLED:false}
devnote.ai.auto-posting.enabled=${AI_POSTING_ENABLED:false}
devnote.ai.auto-posting.cron=${AI_POSTING_CRON:0 0 6 * * *}
devnote.ai.auto-posting.zone=${AI_POSTING_ZONE:Asia/Seoul}
