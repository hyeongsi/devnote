spring.application.name=devnote-webapp

spring.datasource.url=jdbc:h2:mem:devnote;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

devnote.ai.gemini.api-key=${GEMINI_API_KEY:}
devnote.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
devnote.ai.auto-posting.enabled=${AI_POSTING_ENABLED:false}
devnote.ai.auto-posting.cron=${AI_POSTING_CRON:0 0 6 * * *}
devnote.ai.auto-posting.zone=${AI_POSTING_ZONE:Asia/Seoul}
